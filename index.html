<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday, baby Lujine 💖</title>
<meta name="description" content="A little birthday page full of hearts for baby Lujine." />
<meta name="theme-color" content="#ff5d8f" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --pink:#ff8fb8;
    --hot:#ff3d7f;
    --red:#ff2e4d;
    --blue:#8fd8ff;
    --sky:#bfeaff;
    --cream:#fff7fb;
    --ink:#5b1b3a;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100%;
    display:grid;
    place-items:center;
    padding:clamp(16px,4vw,48px);
    font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    background:
      radial-gradient(1200px 700px at 12% 8%, #ffd3e4 0%, transparent 60%),
      radial-gradient(900px 600px at 88% 12%, #cdeeff 0%, transparent 58%),
      radial-gradient(1000px 800px at 50% 108%, #ffc0d4 0%, transparent 62%),
      linear-gradient(135deg,#fff0f6 0%,#ffe3ef 30%,#e9f6ff 65%,#ffe9f2 100%);
    background-size:200% 200%,200% 200%,200% 200%,300% 300%;
    animation:wash 18s ease-in-out infinite;
  }

  @keyframes wash{
    0%,100%{background-position:0% 0%,100% 0%,50% 100%,0% 50%}
    50%{background-position:12% 10%,88% 8%,46% 92%,100% 50%}
  }

  /* ---------- floating hearts ---------- */
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .h{
    position:absolute;
    bottom:-12vh;
    font-size:var(--size,28px);
    line-height:1;
    opacity:0;
    filter:drop-shadow(0 6px 10px rgba(255,61,127,.25));
    animation:rise var(--dur,12s) linear var(--delay,0s) infinite;
    will-change:transform,opacity;
  }
  @keyframes rise{
    0%{transform:translate3d(0,0,0) rotate(0deg) scale(.7);opacity:0}
    10%{opacity:.95}
    50%{transform:translate3d(var(--drift,20px),-55vh,0) rotate(14deg) scale(1)}
    85%{opacity:.75}
    100%{transform:translate3d(calc(var(--drift,20px) * -1),-125vh,0) rotate(-12deg) scale(.85);opacity:0}
  }

  /* ---------- card ---------- */
  .card{
    position:relative;
    z-index:2;
    width:min(660px,100%);
    text-align:center;
    padding:clamp(26px,5vw,52px) clamp(20px,4.5vw,48px);
    border-radius:36px;
    background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.72));
    border:1.5px solid rgba(255,255,255,.9);
    box-shadow:
      0 30px 70px -20px rgba(255,61,127,.45),
      0 12px 30px -12px rgba(143,216,255,.55),
      inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter:blur(10px) saturate(1.1);
    -webkit-backdrop-filter:blur(10px) saturate(1.1);
    animation:pop .9s cubic-bezier(.18,1.2,.32,1) both;
  }
  @keyframes pop{
    from{opacity:0;transform:translateY(26px) scale(.94)}
    to{opacity:1;transform:none}
  }

  .eyebrow{
    margin:0 0 6px;
    font-size:clamp(11px,2.4vw,13px);
    letter-spacing:.32em;
    text-transform:uppercase;
    font-weight:700;
    color:#ff6f9d;
  }

  h1{
    margin:0;
    font-family:"Pacifico",cursive;
    font-weight:400;
    font-size:clamp(34px,9vw,64px);
    line-height:1.06;
    background:linear-gradient(92deg,var(--red) 0%,var(--hot) 28%,#ff77a9 50%,#8fd8ff 78%,#ff3d7f 100%);
    background-size:260% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 7s linear infinite;
    filter:drop-shadow(0 4px 10px rgba(255,61,127,.22));
  }
  @keyframes shine{
    0%{background-position:0% 50%}
    100%{background-position:260% 50%}
  }

  /* ---------- beating heart ---------- */
  .heart-big{
    --s:clamp(78px,17vw,118px);
    width:var(--s);height:var(--s);
    margin:clamp(14px,3vw,22px) auto clamp(16px,3vw,24px);
    position:relative;
    animation:beat 1.5s ease-in-out infinite;
    filter:drop-shadow(0 14px 26px rgba(255,46,77,.42));
  }
  .heart-big::before,
  .heart-big::after{
    content:"";
    position:absolute;
    top:0;left:50%;
    width:52%;height:80%;
    border-radius:50px 50px 0 0;
    background:linear-gradient(140deg,#ff8fb8,#ff3d7f 45%,#ff2e4d);
    transform:translateX(-50%) rotate(-45deg);
    transform-origin:0 100%;
  }
  .heart-big::after{
    left:0;
    transform:translateX(0) rotate(45deg);
    transform-origin:100% 100%;
    background:linear-gradient(220deg,#ffb3cd,#ff5d8f 50%,#ff2e4d);
  }
  @keyframes beat{
    0%,100%{transform:scale(1)}
    14%{transform:scale(1.11)}
    28%{transform:scale(.98)}
    42%{transform:scale(1.06)}
  }

  .love{
    margin:0;
    font-size:clamp(19px,4.6vw,27px);
    font-weight:700;
    line-height:1.45;
    color:#7a1c46;
    text-wrap:balance;
  }
  .love em{
    font-style:normal;
    color:var(--hot);
  }
  .love .name{
    display:inline-block;
    background:linear-gradient(92deg,#ff2e4d,#ff77a9 45%,#5bc6ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:700;
    padding:0 .12em;
  }

  .sub{
    margin:12px 0 0;
    font-size:clamp(13px,3.2vw,15px);
    font-weight:600;
    color:#a35c7e;
  }

  .btn{
    margin-top:clamp(20px,4vw,28px);
    appearance:none;
    border:0;
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    font-size:clamp(14px,3.4vw,16px);
    color:#fff;
    padding:14px 26px;
    border-radius:999px;
    background:linear-gradient(120deg,var(--hot),var(--red) 55%,#ff77a9);
    background-size:180% 100%;
    box-shadow:0 12px 26px -8px rgba(255,46,77,.6),inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .18s ease,box-shadow .18s ease,background-position .5s ease;
    animation:breathe 3.4s ease-in-out infinite;
  }
  .btn:hover{transform:translateY(-2px) scale(1.03);background-position:100% 50%;box-shadow:0 18px 34px -10px rgba(255,46,77,.7)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn:focus-visible{outline:3px solid #5bc6ff;outline-offset:3px}
  @keyframes breathe{
    0%,100%{box-shadow:0 12px 26px -8px rgba(255,46,77,.55),inset 0 1px 0 rgba(255,255,255,.45)}
    50%{box-shadow:0 16px 34px -8px rgba(255,46,77,.8),inset 0 1px 0 rgba(255,255,255,.45)}
  }

  .hint{
    margin:14px 0 0;
    font-size:12px;
    letter-spacing:.06em;
    color:#bb7d99;
  }

  /* burst hearts on click */
  .burst{
    position:fixed;
    z-index:5;
    pointer-events:none;
    font-size:22px;
    animation:fly 1.5s ease-out forwards;
  }
  @keyframes fly{
    0%{transform:translate(-50%,-50%) scale(.4);opacity:1}
    100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.25) rotate(var(--r));opacity:0}
  }

  .footer{
    position:relative;z-index:2;
    margin-top:clamp(18px,4vw,26px);
    font-size:12px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#c07b98;
    text-align:center;
  }

  @media (prefers-reduced-motion:reduce){
    body,.card,h1,.heart-big,.btn,.h{animation:none !important}
    .h{display:none}
  }
</style>
</head>
<body>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<main class="card">
  <p class="eyebrow">today is your day</p>
  <h1>Happy Birthday</h1>

  <div class="heart-big" aria-hidden="true"></div>

  <p class="love">I love you, <span class="name">baby Lujine</span> <em>💖</em></p>
  <p class="sub">Pink, red and light blue — all the colours of my heart for you.</p>

  <button class="btn" id="love" type="button">Send more love 💕</button>
  <p class="hint">tap the button, it never runs out</p>
</main>

<p class="footer">made with love ♥</p>

<script>
  const heartBox = document.getElementById('hearts');
  const glyphs = ['💖','💗','💕','❤️','💙','🩷','💞','🩵'];
  const colours = ['#ff3d7f','#ff2e4d','#ff8fb8','#8fd8ff','#ff77a9','#5bc6ff'];

  function spawnFloating(total){
    for (let i = 0; i < total; i++){
      const h = document.createElement('span');
      h.className = 'h';
      h.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.setProperty('--size', (14 + Math.random() * 30).toFixed(0) + 'px');
      h.style.setProperty('--dur', (9 + Math.random() * 10).toFixed(1) + 's');
      h.style.setProperty('--delay', (-Math.random() * 18).toFixed(1) + 's');
      h.style.setProperty('--drift', (Math.random() * 120 - 60).toFixed(0) + 'px');
      h.style.opacity = 0.55 + Math.random() * 0.45;
      heartBox.appendChild(h);
    }
  }
  spawnFloating(26);

  function burst(x, y, count){
    for (let i = 0; i < count; i++){
      const s = document.createElement('span');
      s.className = 'burst';
      s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 220;
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.color = colours[Math.floor(Math.random() * colours.length)];
      s.style.setProperty('--x', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--y', Math.sin(angle) * dist - 40 + 'px');
      s.style.setProperty('--r', (Math.random() * 240 - 120).toFixed(0) + 'deg');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1600);
    }
  }

  const btn = document.getElementById('love');
  btn.addEventListener('click', (e) => {
    const r = btn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 18);
  });

  window.addEventListener('pointerdown', (e) => {
    if (e.target === btn) return;
    burst(e.clientX, e.clientY, 6);
  }, { passive: true });
</script>
</body>
</html>
